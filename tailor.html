<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailor - Resume Render</title>
<link rel="stylesheet" href="css/shell.css">
<style>
  .jd-list { flex: 0 0 270px; }
  .jd-edit { flex: 1 1 0; }
  .pack { flex: 1.1 1 0; }

  #list { list-style: none; margin: 0; padding: 6px; }
  #list li { display: flex; align-items: center; gap: 7px; padding: 6px 7px; border-radius: 6px; cursor: pointer; }
  #list li:hover { background: #f2f9fb; }
  #list li.on { background: var(--band); }
  #list input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--teal); flex: none; margin: 0; }
  #list .t { flex: 1 1 auto; min-width: 0; }
  #list .t b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .t span { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .fit { flex: none; font-size: 11.5px; font-weight: 700; color: #0f5c75; }
  .list-foot { flex: none; padding: 8px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); line-height: 1.4; }

  .fields { flex: none; display: grid; grid-template-columns: 1fr 1fr 78px; gap: 8px; padding: 10px 12px 0; }
  .fields .wide { grid-column: 1 / -1; }
  .fields input { width: 100%; }
  #jd { flex: 1 1 auto; margin: 8px 12px 12px; min-height: 160px; }
  .jd-edit .pane-head button { margin-left: auto; padding: 2px 8px; font-size: 11.5px; text-transform: none; letter-spacing: 0; font-weight: 400; }

  .opts { flex: none; padding: 10px 12px 0; display: flex; flex-direction: column; gap: 6px; }
  .opts label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .opts label input { width: 15px; height: 15px; accent-color: var(--teal); margin: 0; }
  .opts label .s { color: var(--faint); font-size: 11.5px; }
  .opts label .s.warn { color: #9a5b00; }
  .opts label .s a { color: var(--link); }
  .ask { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 13px; }
  .ask select { flex: 1 1 auto; }
  #preview { flex: 1 1 auto; margin: 10px 12px 0; min-height: 120px; background: #fafbfc; color: #444; }
  .send { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .send .meta { font-size: 12px; color: var(--muted); }
  .send button.primary { padding: 9px 16px; font-size: 14px; }
  .back { flex: none; border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; }
  .back textarea { flex: 1 1 auto; height: 56px; }
</style>
</head>
<body class="kit" data-page="tailor">

<details class="flow" id="flow" open></details>

<div class="work">
  <div class="pane jd-list">
    <div class="pane-head">Job descriptions<button id="new" style="margin-left:auto;padding:2px 8px;font-size:11.5px;text-transform:none;letter-spacing:0">New</button></div>
    <div class="pane-body"><ul id="list"></ul></div>
    <div class="list-foot">Tick several to send them in one package, for a quick look across all of them.</div>
  </div>

  <div class="pane jd-edit">
    <div class="pane-head">Job description<button id="del" title="Delete this job description">Delete</button></div>
    <div class="fields">
      <input type="text" id="f-title" placeholder="Position" autocomplete="off">
      <input type="text" id="f-company" placeholder="Organisation" autocomplete="off">
      <input type="number" id="f-fit" placeholder="Fit %" min="0" max="100" title="The fit % the LLM gave, for your own ranking">
      <input type="url" id="f-url" class="wide" placeholder="Link to the posting" autocomplete="off">
    </div>
    <textarea id="jd" spellcheck="false" placeholder="Paste the full job description here."></textarea>
  </div>

  <div class="pane pack">
    <div class="pane-head">Prompt package<span class="note">What gets copied for the LLM</span></div>
    <div class="opts">
      <label><input type="checkbox" id="p-ins"> Instructions <span class="s" id="s-ins"></span></label>
      <label><input type="checkbox" id="p-repo"> Master resume repository <span class="s" id="s-repo"></span></label>
      <label><input type="checkbox" id="p-jd"> Job description <span class="s" id="s-jd"></span></label>
      <div class="ask">Ask for
        <select id="mode">
          <option value="standard">Full fit analysis with recall questions (Turn 1)</option>
          <option value="quick">Quick look: fit % and top gaps only</option>
          <option value="straight">Straight to the resume, no questions</option>
        </select>
      </div>
    </div>
    <textarea id="preview" readonly spellcheck="false"></textarea>
    <div class="send">
      <button id="copy" class="primary">Copy prompt package</button>
      <span class="meta" id="size"></span>
    </div>
    <div class="back">
      <textarea id="resume" spellcheck="false" placeholder="When the LLM returns the resume Markdown, paste it here."></textarea>
      <button id="dress" title="Loads the pasted resume into the Dresser">Open in Dresser</button>
      <a class="btn" href="doc.html?d=repository&amp;do=enrich"
         title="The LLM's master resume feed holds new and raised evidence units. Merge them into your repository.">Enrich repository</a>
    </div>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/tailor.js"></script>
</body>
</html>
