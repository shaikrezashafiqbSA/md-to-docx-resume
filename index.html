<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dresser - Resume Render</title>
<link rel="stylesheet" href="css/shell.css">
<style>
  /* Palette mirrors js/render.js so the preview and the .docx agree. */
  :root {
    --teal: #177A9A; --bronze: #8F6E54; --grey: #595959; --ink: #262626;
    --band: #E6F2F6; --link: #1155CC;
    --body-font: Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
    --ui-font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono-font: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --shell: #f4f5f7; --panel: #ffffff; --line: #dfe3e8; --muted: #667; --faint: #8a93a0;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--shell); color: #222; overflow: hidden;
         display: flex; flex-direction: column; padding: 12px 18px 18px; gap: 10px;
         font-family: var(--ui-font); font-size: 14px; }

  button { font: inherit; font-size: 13px; border-radius: 5px; cursor: pointer;
           border: 1px solid var(--line); background: #fff; padding: 6px 10px;
           color: #222; white-space: nowrap; }
  button:hover { border-color: var(--teal); background: #f2f9fb; }
  input[type="text"] { padding: 6px 9px; font: inherit; font-size: 13px; min-width: 0;
    border: 1px solid var(--line); border-radius: 5px; background: #fff; color: #222; }
  input[type="text"]:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; }

  /* --------------------------------------------------------------- bar */
  .bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 10px;
         background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .brand { font-size: 14px; font-weight: 700; margin: 0 6px 0 2px; white-space: nowrap; }
  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 5px 5px 0; }
  .seg button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal);
                                     color: #fff; position: relative; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .fmt { min-width: 32px; padding: 6px 8px; font-family: var(--body-font); }
  .spacer { flex: 1 1 auto; }
  #role { flex: 0 1 170px; }
  #filename { flex: 0 2 270px; }
  .pages { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #download { background: var(--teal); color: #fff; border-color: transparent; font-weight: 600; }
  #download:disabled { background: #9aa3ad; cursor: not-allowed; }

  .status { position: fixed; left: 18px; bottom: 14px; z-index: 5; max-width: 520px;
            font-size: 12px; line-height: 1.45; border-radius: 6px;
            box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .status:empty { display: none; }
  .status.ok  { padding: 8px 10px; background: #eef9f1; color: #1c6b39; }
  .status.err { padding: 8px 10px; background: #fdf0f1; color: #97202a; }

  /* ------------------------------------------------------------ layout */
  .layout { flex: 1 1 auto; min-height: 0; display: flex; align-items: stretch; gap: 18px; }
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor-col { flex: 1 1 340px; }
  .stage-col { flex: 1.6 1 0; }
  body.writer .editor-col { display: none; }
  .col-head { display: flex; align-items: baseline; justify-content: space-between;
              gap: 10px; margin-bottom: 6px; font-size: 11px; font-weight: 600;
              text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .col-head .note { font-weight: 400; text-transform: none; letter-spacing: 0;
                    font-size: 11.5px; color: var(--faint); }

  .editor-box { position: relative; flex: 1 1 auto; min-height: 0; display: flex;
                overflow: hidden; border-radius: 8px; }
  /* The Markdown line behind the text clicked on the sheet. */
  #md-band { position: absolute; left: 1px; top: 0; pointer-events: none;
             background: rgba(255,214,51,.28); box-shadow: inset 3px 0 0 #f2b705; }
  /* A hidden copy of the Markdown, same type and width, to measure where a
     wrapped line sits. A textarea cannot say. */
  #md-mirror { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none;
               box-sizing: border-box; padding: 14px 16px;
               font-family: var(--mono-font); font-size: 12.5px; line-height: 1.55;
               tab-size: 2; white-space: pre-wrap; overflow-wrap: break-word; }
  #editor { flex: 1 1 auto; min-width: 0; width: 100%; resize: none; padding: 14px 16px;
            border: 1px solid var(--line); border-radius: 8px; background: #fff;
            font-family: var(--mono-font); font-size: 12.5px; line-height: 1.55;
            color: #24292f; tab-size: 2; }
  #editor.over { border-color: var(--teal); background: #f2f9fb; }

  /* ----------------------------------------------------------- preview */
  .stage { flex: 1 1 auto; overflow: auto; }
  .scaler { margin: 0 auto; }
  .sheet-wrap { position: relative; width: 210mm; transform-origin: top left; }
  #rules { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .page-rule { position: absolute; left: 0; right: 0; border-top: 1px dashed #c3c9d2; }
  .page-rule::after { content: attr(data-label); position: absolute; right: 4px;
                      top: 3px; font-size: 10px; color: #a9b0ba; }

  /* A4 at the same margins the .docx uses, so the ruler means something. */
  #sheet { width: 210mm; min-height: 297mm; padding: 0.75in;
           background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12);
           font-family: var(--body-font); font-size: 10pt; color: var(--ink);
           line-height: 1.3; }

  #sheet p { margin: 0; }
  .r-name { font-size: 18pt; font-weight: 700; color: var(--teal); margin-bottom: 1pt; }
  .r-contact { font-size: 9.5pt; color: var(--grey); margin-bottom: 3pt; white-space: pre-wrap; }
  .r-headline { font-size: 10.5pt; font-weight: 700; color: var(--bronze); margin-bottom: 1pt; }
  /* With no italic line under it, the tagline closes the header itself. */
  .r-headline.end { border-bottom: 1.5px solid var(--bronze); padding-bottom: 3pt;
                    margin-bottom: 8pt; }
  .r-subline { font-size: 9.5pt; font-style: italic; color: var(--bronze);
               border-bottom: 1.5px solid var(--bronze); padding-bottom: 3pt;
               margin-bottom: 8pt; }

  .r-section { font-size: 11.5pt; font-weight: 700; text-transform: uppercase;
               letter-spacing: .02em; color: var(--teal);
               border-left: 3px solid var(--bronze);
               border-bottom: 0.75px solid var(--teal);
               padding: 0 0 3pt 6pt; margin: 11pt 0 5pt; }
  /* One line per role: title loudest, employer second, dates at the margin. */
  .r-role { display: flex; justify-content: space-between; align-items: baseline;
            align-items: last baseline; gap: 10pt; margin-top: 9pt; margin-bottom: 2pt; }
  .r-role .r-title { font-size: 11pt; font-weight: 700; color: var(--teal); }
  .r-role .r-emp { font-size: 10pt; font-weight: 700; color: var(--bronze); }
  .r-role .r-pipe { font-size: 10pt; color: var(--grey); white-space: pre; }
  .r-role .r-dates { flex: none; font-size: 9.5pt; color: var(--grey); white-space: nowrap; }
  .r-context { font-size: 9.5pt; font-style: italic; color: var(--grey); margin-bottom: 4pt; }
  .r-subhead { font-size: 9pt; font-weight: 700; text-transform: uppercase;
               letter-spacing: .03em; color: var(--bronze);
               border-left: 1.5px solid var(--bronze);
               padding-left: 5pt; margin: 6pt 0 3pt 1pt; }
  .r-callout { font-size: 9.5pt; font-style: italic; color: var(--teal);
               border-left: 2.5px solid var(--teal); padding-left: 8pt;
               margin: 4pt 0 6pt 1pt; }
  .r-skill { font-size: 8.5pt; color: var(--ink); background: var(--band);
             border-left: 2.5px solid var(--bronze); padding: 3pt 4pt 3pt 6pt;
             margin-bottom: 3pt; }
  .r-skill.alt { background: #fff; box-shadow: inset 0 0 0 1px #eef2f4; }
  .r-skill .r-skill-label { font-weight: 700; color: var(--teal); }
  /* A qualification is laid out like a role line, in plain type: degree,
     university, year at the margin. */
  .r-edu { display: flex; justify-content: space-between; align-items: baseline;
           align-items: last baseline; gap: 10pt; font-size: 10pt; margin-top: 3pt; }
  .r-edu .r-deg { color: var(--ink); }
  .r-edu .r-edu-meta { color: var(--grey); }
  .r-edu .r-dates { flex: none; font-size: 9.5pt; color: var(--grey); white-space: nowrap; }
  .r-note { font-size: 10pt; color: var(--ink); margin: 1pt 0 5pt; }
  .r-para { margin-bottom: 5pt; }
  .r-bullet { position: relative; padding-left: 16pt; margin-bottom: 3pt; }
  .r-bullet::before { content: "\2022"; position: absolute; left: 5pt; color: var(--grey); }
  #sheet strong, #sheet b { color: inherit; font-weight: 700; }
  .r-bullet strong, .r-bullet b { color: var(--ink); }
  #sheet a { color: var(--link); }

  /* Every piece of text on the sheet is editable in place. */
  .ed { outline: none; border-radius: 2px; cursor: text; }
  .ed.blk { display: block; min-height: 1.3em; }
  .ed:empty::before { content: "\200B"; }
  .ed:hover { background: rgba(23,122,154,.07); }
  .ed:focus { background: rgba(23,122,154,.10); box-shadow: 0 0 0 1.5px rgba(23,122,154,.55); }

  /* The block the Markdown caret is in. */
  #sheet .hl { position: relative; background: #fff4c2 !important;
               outline: 2px solid #f2b705; outline-offset: 1px; border-radius: 2px; }

  /* Below this width two columns stop being readable, so the page becomes an
     ordinary scrolling document instead. */
  @media (max-width: 1100px) {
    body { overflow: auto; height: auto; }
    .bar { flex-wrap: wrap; }
    .layout { flex-direction: column; }
    .col { flex: none; }
    #editor { height: 40vh; }
    .stage { overflow: visible; }
  }
</style>
</head>
<body data-page="dresser">

<details class="flow" id="flow" open></details>

<div class="bar" id="bar">
  <span class="brand">Resume Render</span>
  <div class="seg" role="group" aria-label="View">
    <button id="view-split" aria-pressed="true" title="Markdown beside the sheet">Split</button>
    <button id="view-writer" aria-pressed="false" title="The sheet only. Edit straight on it.">Writer</button>
  </div>
  <span class="sep"></span>
  <button class="fmt" data-fmt="bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="fmt" data-fmt="italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <button class="fmt" data-fmt="link" title="Hyperlink (Ctrl+K)"><u>Link</u></button>
  <span class="sep"></span>
  <button id="open" title="Load a .md file">Open</button>
  <button id="sample" title="Replace the text with the bundled sample">Sample</button>
  <span class="spacer"></span>
  <input type="text" id="role" placeholder="Target role (file name only)" autocomplete="off"
         title="Only sets the file name. It is not written into the document.">
  <input type="text" id="filename" autocomplete="off" spellcheck="false"
         title="File name. Clear the box to track the role again.">
  <span class="pages" id="pages"></span>
  <button id="download" disabled>Download .docx</button>
</div>

<div class="layout">
  <div class="col editor-col">
    <div class="col-head"><span>Markdown</span><span class="note" id="source"></span></div>
    <div class="editor-box">
      <textarea id="editor" spellcheck="false"
                placeholder="Paste the resume Markdown here, or drop a .md file."></textarea>
      <div id="md-band" hidden></div>
      <div id="md-mirror" aria-hidden="true"></div>
    </div>
    <input type="file" id="file" hidden accept=".md,.markdown,.txt,text/markdown,text/plain">
  </div>

  <div class="col stage-col">
    <div class="col-head"><span>Preview</span><span class="note">A4. Click any text to edit it and see its Markdown line. Enter adds a bullet.</span></div>
    <div class="stage">
      <div class="scaler" id="scaler">
        <div class="sheet-wrap" id="wrap">
          <div id="rules"></div>
          <div id="sheet"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<p class="status" id="status"></p>

<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
<script src="js/nav.js"></script>
<script src="js/parse.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
