<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Render</title>
<style>
  /* Palette mirrors js/render.js so the preview and the .docx agree. */
  :root {
    --teal: #177A9A; --bronze: #8F6E54; --grey: #595959; --ink: #262626;
    --band: #E6F2F6; --link: #1155CC;
    --body-font: Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
    --ui-font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono-font: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --shell: #f4f5f7; --panel: #ffffff; --line: #dfe3e8;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--shell); color: #222; overflow: hidden;
         font-family: var(--ui-font); font-size: 14px; }

  .layout { display: flex; align-items: stretch; gap: 18px;
            height: 100%; padding: 18px; }

  /* ---------------------------------------------------------- controls */
  .panel { flex: 0 0 288px; overflow-y: auto; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .panel h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: .01em; }
  .panel .sub { color: #667; font-size: 12px; margin: 0 0 14px; line-height: 1.4; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
              color: #667; margin: 18px 0 6px; font-weight: 600; }
  .panel .field-note { font-size: 11.5px; color: #8a93a0; margin: 4px 0 0;
                       line-height: 1.4; word-break: break-all; }
  input[type="text"] {
    width: 100%; padding: 7px 9px; font: inherit; font-size: 13px;
    border: 1px solid var(--line); border-radius: 5px; background: #fff; color: #222; }
  input[type="text"]:focus, textarea:focus {
    outline: 2px solid var(--teal); outline-offset: -1px; }

  .row { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
  button { font: inherit; font-size: 13px; border-radius: 5px; cursor: pointer;
           border: 1px solid var(--line); background: #fff; padding: 8px 11px; }
  button:hover { border-color: #b9c0c9; }
  #download { flex: 1; background: var(--teal); color: #fff; border-color: transparent;
              font-weight: 600; }
  #download:disabled { background: #9aa3ad; cursor: not-allowed; }

  .pages { margin-top: 14px; font-size: 12px; color: #667; }
  .status { margin-top: 10px; font-size: 12px; line-height: 1.45; }
  .status.ok  { padding: 8px 10px; border-radius: 5px; background: #eef9f1; color: #1c6b39; }
  .status.err { padding: 8px 10px; border-radius: 5px; background: #fdf0f1; color: #97202a; }

  /* ------------------------------------------------------------ editor */
  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor-col { flex: 1 1 380px; }
  .col-head { display: flex; align-items: baseline; justify-content: space-between;
              gap: 10px; margin-bottom: 7px; font-size: 11px; font-weight: 600;
              text-transform: uppercase; letter-spacing: .08em; color: #667; }
  .col-head .note { font-weight: 400; text-transform: none; letter-spacing: 0;
                    font-size: 11.5px; color: #8a93a0; }
  .col-head button { padding: 3px 8px; font-size: 11.5px; }

  #editor { flex: 1 1 auto; width: 100%; resize: none; padding: 14px 16px;
            border: 1px solid var(--line); border-radius: 8px; background: #fff;
            font-family: var(--mono-font); font-size: 12.5px; line-height: 1.55;
            color: #24292f; tab-size: 2; }
  #editor.over { border-color: var(--teal); background: #f2f9fb; }

  /* ----------------------------------------------------------- preview */
  .stage-col { flex: 1.35 1 0; }
  .stage { flex: 1 1 auto; overflow: auto; }
  .scaler { margin: 0 auto; }
  .sheet-wrap { position: relative; width: 210mm; transform-origin: top left; }
  #rules { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .page-rule { position: absolute; left: 0; right: 0; border-top: 1px dashed #c3c9d2; }
  .page-rule::after { content: attr(data-label); position: absolute; right: 4px;
                      top: 3px; font-size: 10px; color: #a9b0ba; }

  /* A4 at the same margins the .docx uses, so the ruler means something. */
  #sheet { width: 210mm; min-height: 297mm; padding: 0.75in;
           background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12);
           font-family: var(--body-font); font-size: 10pt; color: var(--ink);
           line-height: 1.3; }

  #sheet p { margin: 0; }
  .r-name { font-size: 18pt; font-weight: 700; color: var(--teal); margin-bottom: 1pt; }
  .r-contact { font-size: 9.5pt; color: var(--grey); margin-bottom: 3pt; }
  .r-headline { font-size: 10.5pt; font-weight: 700; color: var(--teal); margin-bottom: 1pt; }
  .r-subline { font-size: 9.5pt; font-style: italic; color: var(--bronze);
               border-bottom: 1.5px solid var(--bronze); padding-bottom: 3pt;
               margin-bottom: 8pt; }

  .r-section { font-size: 11.5pt; font-weight: 700; text-transform: uppercase;
               letter-spacing: .02em; color: var(--teal);
               border-left: 3px solid var(--bronze);
               border-bottom: 0.75px solid var(--teal);
               padding: 0 0 3pt 6pt; margin: 11pt 0 5pt; }
  .r-role { font-size: 11pt; font-weight: 700; color: var(--teal); margin-top: 11pt; }
  .r-org { font-size: 10pt; margin-bottom: 3pt; }
  .r-org .r-emp { font-weight: 700; color: var(--bronze); }
  .r-org .r-dates { color: var(--grey); }
  .r-context { font-size: 9.5pt; font-style: italic; color: var(--grey); margin-bottom: 4pt; }
  .r-subhead { font-size: 9pt; font-weight: 700; text-transform: uppercase;
               letter-spacing: .03em; color: var(--bronze);
               border-left: 1.5px solid var(--bronze);
               padding-left: 5pt; margin: 6pt 0 3pt 1pt; }
  .r-callout { font-size: 9.5pt; font-style: italic; color: var(--teal);
               border-left: 2.5px solid var(--teal); padding-left: 8pt;
               margin: 4pt 0 6pt 1pt; }
  .r-skill { font-size: 8.5pt; color: var(--ink); background: var(--band);
             border-left: 2.5px solid var(--bronze); padding: 3pt 4pt 3pt 6pt;
             margin-bottom: 3pt; }
  .r-skill.alt { background: #fff; box-shadow: inset 0 0 0 1px #eef2f4; }
  .r-skill .r-skill-label { font-weight: 700; color: var(--teal); }
  .r-edu { font-size: 10pt; margin-top: 6pt; }
  .r-edu .r-deg { font-weight: 700; color: var(--teal); }
  .r-edu .r-edu-meta { color: var(--grey); }
  .r-note { font-size: 10pt; color: var(--ink); margin: 1pt 0 5pt; }
  .r-para { margin-bottom: 5pt; }
  .r-bullet { position: relative; padding-left: 16pt; margin-bottom: 3pt; }
  .r-bullet::before { content: "\2022"; position: absolute; left: 5pt; color: var(--grey); }
  #sheet strong { color: inherit; }
  .r-bullet strong { color: var(--ink); }
  #sheet a { color: var(--link); }

  /* Below this width the three columns stop being readable, so the page
     becomes an ordinary scrolling document instead. */
  @media (max-width: 1100px) {
    body { overflow: auto; }
    .layout { flex-direction: column; height: auto; }
    .panel { flex: none; overflow: visible; }
    .col { flex: none; }
    #editor { height: 45vh; }
    .stage { overflow: visible; }
  }
</style>
</head>
<body>

<div class="layout">
  <div class="panel">
    <h1>Resume Render</h1>
    <p class="sub">Write Markdown, watch the Word document build. Nothing leaves
    your browser.</p>

    <h2>Target role</h2>
    <input type="text" id="role" placeholder="e.g. Deputy Project Manager"
           autocomplete="off">
    <p class="field-note">Only sets the file name. It is not written into the
    document.</p>

    <h2>File name</h2>
    <input type="text" id="filename" autocomplete="off" spellcheck="false">
    <p class="field-note" id="filename-note"></p>

    <div class="row">
      <button id="download" disabled>Download .docx</button>
    </div>

    <p class="pages" id="pages"></p>
    <p class="status" id="status"></p>
  </div>

  <div class="col editor-col">
    <div class="col-head">
      <span>Markdown</span>
      <span>
        <span class="note" id="source"></span>
        <button id="open" title="Load a .md file into the editor">Open file</button>
        <button id="sample" title="Replace the editor with the bundled sample">Sample</button>
      </span>
    </div>
    <textarea id="editor" spellcheck="false"
              placeholder="Start typing, paste a resume, or drop a .md file here."></textarea>
    <input type="file" id="file" hidden
           accept=".md,.markdown,.txt,text/markdown,text/plain">
  </div>

  <div class="col stage-col">
    <div class="col-head"><span>Preview</span><span class="note">A4, live</span></div>
    <div class="stage">
      <div class="scaler" id="scaler">
        <div class="sheet-wrap" id="wrap">
          <div id="rules"></div>
          <div id="sheet"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js"></script>
<script src="js/parse.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
